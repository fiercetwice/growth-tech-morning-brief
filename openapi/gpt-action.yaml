openapi: 3.1.0
info:
  title: Growth Tech Morning Brief API
  description: Read the latest saved Growth Tech morning brief or explicitly refresh its market snapshot.
  version: 0.5.9.0
servers:
  - url: https://growth-tech-morning-brief.ck-market-tools.workers.dev
paths:
  /health:
    get:
      operationId: checkBriefServiceHealth
      summary: Check whether the brief service is online
      description: Use only for troubleshooting service availability.
      security: []
      responses:
        "200":
          description: Service is online.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /latest:
    get:
      operationId: getLatestBrief
      summary: Get the latest saved Growth Tech morning brief
      description: Default action for answering questions about the current brief. Returns compact structured data and ready-to-render Markdown without recomputing the snapshot.
      responses:
        "200":
          description: Latest saved brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No brief has been generated yet.
        "503":
          description: Brief storage is not configured.
  /run:
    post:
      operationId: refreshMorningBrief
      summary: Refresh and save the Growth Tech morning brief
      description: Call only when the user explicitly asks to refresh, regenerate, or run today's brief. This performs upstream data collection and may take longer than reading the latest saved brief.
      responses:
        "200":
          description: Newly generated and saved brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Upstream market or filing data prevented snapshot generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [ok, service, version, buildRevision]
      properties:
        ok:
          type: boolean
        service:
          type: string
        version:
          type: string
        buildRevision:
          type: string
    Coverage:
      type: object
      required: [requested, succeeded, failed]
      properties:
        requested:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
    OpportunityGate:
      type: object
      required: [rule, maximumOpportunities, allowedTodayActions, defaultVerdict, candidates]
      properties:
        rule: { type: string }
        maximumOpportunities: { type: integer }
        allowedTodayActions:
          type: array
          items: { type: string }
        defaultVerdict: { type: string }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistRow"
    Discovery:
      type: object
      required: [status, source, scanned, eligibleAfterLiquidityAndRelevance, candidates]
      properties:
        status: { type: string }
        source: { type: string }
        scanned: { type: integer }
        eligibleAfterLiquidityAndRelevance: { type: integer }
        filters: { type: [object, "null"] }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistRow"
    Valuation:
      type: object
      nullable: true
      properties:
        trailingPE: { type: [number, "null"] }
        trailingPS: { type: [number, "null"] }
        trailingPEPercentile5Y: { type: [number, "null"] }
        trailingPSPercentile5Y: { type: [number, "null"] }
        selectedMetric:
          type: string
          enum: [trailingPE, trailingPS]
        selectedPercentile: { type: [number, "null"] }
        fundamentalAsOf: { type: [string, "null"] }
    TargetAndMispricing:
      type: object
      required: [status, currentPrice, confidence, valuationAdjustment, valuationLabel, consensusCrossCheck]
      properties:
        status: { type: string, enum: [available, unavailable] }
        currentPrice: { type: [number, "null"] }
        priceAsOf: { type: [string, "null"] }
        inputAsOf: { type: [string, "null"] }
        bearValue: { type: number }
        baseValue: { type: number }
        bullValue: { type: number }
        baseUpsidePercent: { type: number }
        downsideToBearPercent: { type: number }
        riskRewardRatio: { type: [number, "null"] }
        preferredEntryPrice: { type: number }
        buyZones:
          type: object
          properties:
            status: { type: string, enum: [available, unavailable] }
            suggested:
              type: object
              properties:
                low: { type: number }
                high: { type: number }
            stronger:
              type: object
              properties:
                low: { type: number }
                high: { type: number }
            currentPosition: { type: string }
            inputs: { type: object }
            method: { type: string }
            reason: { type: string }
        method: { type: string }
        formula: { type: string }
        assumptions: { type: string }
        confidence: { type: string, enum: [High, Medium, Low, Unavailable] }
        valuationAdjustment: { type: integer, minimum: -2, maximum: 2 }
        valuationLabel: { type: string, enum: [Opportunity Bonus, Opportunity Penalty, Neutral] }
        reason: { type: string }
        consensusCrossCheck: { type: object }
    WatchlistRow:
      type: object
      required: [symbol, missing]
      properties:
        symbol: { type: string }
        name: { type: [string, "null"] }
        price: { type: [number, "null"] }
        changePercent: { type: [number, "null"] }
        yearLow: { type: [number, "null"] }
        yearHigh: { type: [number, "null"] }
        positionIn52WeekRange: { type: [number, "null"] }
        valuation:
          $ref: "#/components/schemas/Valuation"
        targetAndMispricing:
          $ref: "#/components/schemas/TargetAndMispricing"
        missing: { type: boolean }
        error: { type: string }
    Brief:
      type: object
      required: [schemaVersion, generatedAt, session, coverage, discovery, opportunityGate, watchlist, markdown]
      properties:
        schemaVersion:
          type: integer
          enum: [9]
        generatedAt:
          type: string
          format: date-time
        session:
          type: string
        coverage:
          $ref: "#/components/schemas/Coverage"
        opportunityGate:
          $ref: "#/components/schemas/OpportunityGate"
        discovery:
          $ref: "#/components/schemas/Discovery"
        watchlist:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistRow"
        markdown:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
security:
  - bearerAuth: []
