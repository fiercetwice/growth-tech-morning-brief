name: Test and Deploy Stock Research MCP

on:
  push:
    branches:
      - stock-research-mcp-v0.1
    paths:
      - 'mcp/**'
      - '.github/workflows/stock-research-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-research-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm install

      - name: Run MCP tests
        working-directory: mcp
        run: npm test

      - name: Ensure R2 bucket exists
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output="$(npx wrangler r2 bucket create stock-research-mcp-data 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ] && ! grep -Eqi 'already exists|already been created|10004' <<< "$output"; then
            exit "$status"
          fi

      - name: Seed ticker-to-CIK resolver mirror into R2
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/jadchaar/sec-cik-mapper/main/mappings/stocks/ticker_to_cik.json' \
            -o /tmp/ticker_to_cik.json
          jq -e 'length > 1000 and .AAPL == "0000320193" and .MSFT == "0000789019"' /tmp/ticker_to_cik.json >/dev/null
          jq 'to_entries | map({key: .key, value: {ticker: .key, cik_str: (.value | tonumber), title: ""}}) | from_entries' \
            /tmp/ticker_to_cik.json > /tmp/company_tickers.json
          jq -e 'length > 1000 and .AAPL.cik_str == 320193 and .MSFT.cik_str == 789019' /tmp/company_tickers.json >/dev/null
          npx wrangler r2 object put 'stock-research-mcp-data/sec/ticker-map.json' --file=/tmp/company_tickers.json
          echo 'Ticker-to-CIK resolver mirror seeded into R2'

      - name: Deploy MCP Worker
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Sync Worker secrets when available
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$RUN_TOKEN" ]; then
            printf '%s' "$RUN_TOKEN" | npx wrangler secret put RUN_TOKEN
          else
            echo 'RUN_TOKEN GitHub secret not present; Worker /mcp will stay locked while RUN_TOKEN_REQUIRED=true.'
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          else
            echo 'GEMINI_API_KEY GitHub secret not present; Gemini AI enrichment will remain disabled.'
          fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            printf '%s' "$DEEPSEEK_API_KEY" | npx wrangler secret put DEEPSEEK_API_KEY
          else
            echo 'DEEPSEEK_API_KEY GitHub secret not present; DeepSeek AI enrichment will remain disabled.'
          fi

      - name: Smoke test health endpoint
        env:
          WORKER_URL: https://stock-research-mcp.ck-market-tools.workers.dev
        run: |
          expected_version="$(jq -r '.version' mcp/package.json)"
          for attempt in $(seq 1 24); do
            if health="$(curl --fail --silent --show-error --max-time 20 "$WORKER_URL/health" 2>/dev/null)"; then
              version="$(jq -r '.version // empty' <<< "$health")"
              if [ "$version" = "$expected_version" ]; then
                echo "$health"
                break
              fi
            fi
            if [ "$attempt" = "24" ]; then
              echo "MCP health endpoint did not report v$expected_version"
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test public Radar HTTP API
        env:
          WORKER_URL: https://stock-research-mcp.ck-market-tools.workers.dev
        run: |
          entry_file="$(mktemp)"
          entry_code="$(curl --silent --show-error --max-time 60 -o "$entry_file" -w '%{http_code}' "$WORKER_URL/api/v1/entry?ticker=AAPL")"
          echo "entry HTTP $entry_code"
          cat "$entry_file"
          echo
          [ "$entry_code" = "200" ]
          jq -e '.ok == true and .data.ticker == "AAPL" and (.data.buyNowDataGate | type == "boolean")' "$entry_file" >/dev/null
          echo "entry endpoint ok"

          packet_file="$(mktemp)"
          packet_code="$(curl --silent --show-error --max-time 120 -o "$packet_file" -w '%{http_code}' "$WORKER_URL/api/v1/watchlist?tickers=AAPL,MSFT")"
          echo "watchlist HTTP $packet_code"
          cat "$packet_file"
          echo
          [ "$packet_code" = "200" ]
          jq -e '.ok == true and .data.requested == 2 and (.data.rows | length) >= 1' "$packet_file" >/dev/null
          echo "watchlist endpoint ok"

      - name: Smoke test MCP with official client
        working-directory: mcp
        env:
          WORKER_URL: https://stock-research-mcp.ck-market-tools.workers.dev
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: npm run smoke:mcp
