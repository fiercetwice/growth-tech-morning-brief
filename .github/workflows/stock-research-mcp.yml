name: Test and Deploy Stock Research MCP

on:
  push:
    branches:
      - stock-research-mcp-v0.1
    paths:
      - 'mcp/**'
      - '.github/workflows/stock-research-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-research-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm install

      - name: Run MCP tests
        working-directory: mcp
        run: npm test

      - name: Ensure R2 bucket exists
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output="$(npx wrangler r2 bucket create stock-research-mcp-data 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ] && ! grep -Eqi 'already exists|already been created|10004' <<< "$output"; then
            exit "$status"
          fi

      - name: Deploy MCP Worker
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Sync Worker secrets when available
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$RUN_TOKEN" ]; then
            printf '%s' "$RUN_TOKEN" | npx wrangler secret put RUN_TOKEN
          else
            echo 'RUN_TOKEN GitHub secret not present; Worker /mcp will stay locked while RUN_TOKEN_REQUIRED=true.'
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          else
            echo 'GEMINI_API_KEY GitHub secret not present; Gemini AI enrichment will remain disabled.'
          fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            printf '%s' "$DEEPSEEK_API_KEY" | npx wrangler secret put DEEPSEEK_API_KEY
          else
            echo 'DEEPSEEK_API_KEY GitHub secret not present; DeepSeek AI enrichment will remain disabled.'
          fi

      - name: Smoke test health endpoint
        env:
          WORKER_URL: https://stock-research-mcp.ck-market-tools.workers.dev
        run: |
          expected_version="$(jq -r '.version' mcp/package.json)"
          for attempt in $(seq 1 24); do
            if health="$(curl --fail --silent --show-error --max-time 20 "$WORKER_URL/health" 2>/dev/null)"; then
              version="$(jq -r '.version // empty' <<< "$health")"
              if [ "$version" = "$expected_version" ]; then
                echo "$health"
                break
              fi
            fi
            if [ "$attempt" = "24" ]; then
              echo "MCP health endpoint did not report v$expected_version"
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test MCP tools list
        env:
          WORKER_URL: https://stock-research-mcp.ck-market-tools.workers.dev
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: |
          if [ -z "$RUN_TOKEN" ]; then
            echo 'RUN_TOKEN GitHub secret is required for MCP protocol smoke test.'
            exit 1
          fi
          response="$(curl --fail --silent --show-error --max-time 30 \
            --request POST \
            --url "$WORKER_URL/mcp" \
            --header "Authorization: Bearer $RUN_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2026-07-28' \
            --header 'Mcp-Method: tools/list' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/clientInfo":{"name":"github-smoke","version":"1.0.0"}}}}')"
          echo "$response" | head -c 2000
          for tool in analyze_stock get_stock_snapshot analyze_watchlist get_earnings_calendar; do
            if ! grep -q "\"$tool\"" <<< "$response"; then
              echo "Missing expected MCP tool: $tool"
              exit 1
            fi
          done
          echo 'MCP tools/list smoke test passed.'
