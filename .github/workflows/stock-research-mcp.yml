name: Test and Deploy Stock Research MCP

on:
  push:
    branches:
      - stock-research-mcp-v0.1
    paths:
      - 'mcp/**'
      - '.github/workflows/stock-research-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-research-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm install

      - name: Run MCP tests
        working-directory: mcp
        run: npm test

      - name: Ensure R2 bucket exists
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output="$(npx wrangler r2 bucket create stock-research-mcp-data 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ] && ! grep -Eqi 'already exists|already been created|10004' <<< "$output"; then
            exit "$status"
          fi

      - name: Deploy MCP Worker
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Sync RUN_TOKEN when available
        if: ${{ secrets.RUN_TOKEN != '' }}
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: printf '%s' "$RUN_TOKEN" | npx wrangler secret put RUN_TOKEN

      - name: Sync Gemini key when available
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY

      - name: Sync DeepSeek key when available
        if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: printf '%s' "$DEEPSEEK_API_KEY" | npx wrangler secret put DEEPSEEK_API_KEY

      - name: Smoke test health endpoint
        env:
          WORKER_URL: https://stock-research-mcp.ck-market-tools.workers.dev
        run: |
          for attempt in $(seq 1 24); do
            if health="$(curl --fail --silent --show-error --max-time 20 "$WORKER_URL/health" 2>/dev/null)"; then
              version="$(jq -r '.version // empty' <<< "$health")"
              if [ "$version" = "0.2.0" ]; then
                echo "$health"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'MCP health endpoint did not report v0.2.0'
          exit 1
