name: Test and Deploy Worker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run post-deploy report test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
          WORKER_URL: https://growth-tech-morning-brief.ck-market-tools.workers.dev
        run: |
          if [ -z "$RUN_TOKEN" ]; then
            echo "::error::The RUN_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi

          expected_version="$(jq -r '.version' package.json)"
          for attempt in $(seq 1 24); do
            deployed_version="$(curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              "$WORKER_URL/health" | jq -r '.version // empty' || true)"
            if [ "$deployed_version" = "$expected_version" ]; then
              break
            fi
            if [ "$attempt" = "24" ]; then
              echo "::error::Worker v$expected_version did not become active before the smoke-test deadline."
              exit 1
            fi
            sleep 5
          done

          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 300 \
            --request POST \
            --url "$WORKER_URL/run-report" \
            --header "Authorization: Bearer $RUN_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "forceRegenerate": true,
              "forceDelivery": true,
              "provider": "deepseek",
              "model": "deepseek-v4-flash"
            }')"

          jq -e '
            .report.generated == true and
            .report.stored == true and
            .report.aiProvider == "deepseek" and
            .report.aiModel == "deepseek-v4-flash" and
            .report.generation.validation == "passed" and
            .report.webhook.sent == true
          ' <<< "$response" > /dev/null

          jq '{
            date: .report.date,
            generated: .report.generated,
            stored: .report.stored,
            aiProvider: .report.aiProvider,
            aiModel: .report.aiModel,
            validation: .report.generation.validation,
            webhook: .report.webhook
          }' <<< "$response"
