name: Test and Deploy Worker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # v0.5.11.2: deployment verification must never generate or deliver a report.
      # Calling /run-report here caused an additional production report generation and
      # Discord delivery on every push to main. Keep deploy verification read-only.
      - name: Verify deployed Worker health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WORKER_URL: https://growth-tech-morning-brief.ck-market-tools.workers.dev
        run: |
          expected_version="$(jq -r '.version' package.json)"
          expected_build_revision="$(jq -r '.buildRevision' package.json)"

          for attempt in $(seq 1 24); do
            health="$(curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              "$WORKER_URL/health" || true)"

            deployed_version="$(jq -r '.version // empty' <<< "$health" 2>/dev/null || true)"
            deployed_build_revision="$(jq -r '.buildRevision // empty' <<< "$health" 2>/dev/null || true)"

            if [ "$deployed_version" = "$expected_version" ] && [ "$deployed_build_revision" = "$expected_build_revision" ]; then
              echo "Worker health check passed: v$deployed_version build $deployed_build_revision"
              {
                echo "### Post-deploy smoke test"
                echo "- ✅ Worker health endpoint is active."
                echo "- ✅ Version: $deployed_version"
                echo "- ✅ Build revision: $deployed_build_revision"
                echo "- ✅ No report generation or Discord delivery was triggered by deployment."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$attempt" = "24" ]; then
              echo "::error::Worker v$expected_version build $expected_build_revision did not become active before the smoke-test deadline."
              echo "Last health response: $health"
              exit 1
            fi

            sleep 5
          done
